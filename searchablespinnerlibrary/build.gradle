plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

// --- CONTOURNEMENT TEMPORAIRE -------------------------------------------------
// Le dossier searchablespinnerlibrary/build/intermediates est corrompu au niveau
// NTFS (volume E: signale "Full Repair Needed") : il est illisible et ne peut ni
// etre supprime ni recevoir de nouveaux sous-dossiers, ce qui fait echouer 7 taches
// Gradle. On deporte le repertoire de build de ce module hors de la zone corrompue.
// A RETIRER une fois "chkdsk E: /f" execute et le dossier build/ supprime.
buildDir = "$rootDir/build-searchablespinnerlibrary"
// ------------------------------------------------------------------------------

android {
    namespace "com.toptoche.searchablespinnerlibrary"
    compileSdk 33

    defaultConfig {
        //applicationId "com.tejob.torrentlinkfinder"
        versionCode 1
        versionName "1.0"
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {

    //implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    //implementation 'androidx.core:core-ktx:1.3.1'

    //implementation 'androidx.core:core-ktx:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.2'
    // Size and Dimens
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'


}